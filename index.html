<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 샘, 내 물길</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="screen">
    <div class="desktop">
      <section id="window" class="window" aria-label="게임 창">
        <header class="titlebar">
          <div class="title-left">
            <span class="app-title">내 샘, 내 물길</span>
          </div>
          <div class="title-right">
            <nav id="level-dots" class="level-dots" aria-label="판 고르기"></nav>
            <button id="btn-difficulty" class="title-btn" type="button"></button>
            <button id="btn-undo" class="title-btn icon" type="button" aria-label="되돌리기">↶</button>
            <button id="btn-restart" class="title-btn icon" type="button" aria-label="처음부터">↻</button>
            <button id="btn-reset" class="title-btn icon" type="button" aria-label="진행 기록을 지우고 프롤로그부터 다시 시작">⌂</button>
          </div>
        </header>

        <div id="window-body" class="window-body">
          <div id="stage" class="stage">
            <div id="scene" class="scene">
              <div id="top-view" class="view top-view">
              </div>
              <div id="side-view" class="view side-view" hidden>
              </div>
              <div id="board" class="board">
                <div id="gaze-now" class="gaze-zone" hidden></div>
                <div id="gaze-next" class="gaze-zone next" hidden></div>
                <div id="steam-cloud" class="steam-cloud" hidden></div>
                <div id="aim-band" class="aim-band"></div>
                <div id="divider" class="divider"></div>
              </div>
              <svg id="aim-layer" class="aim-layer" viewBox="0 0 960 540" aria-hidden="true">
                <g id="aim-hints" class="aim-hints"></g>
                <polyline id="aim-path" class="aim-path" points=""></polyline>
              </svg>
              <div id="fx-layer" class="fx-layer"></div>
            </div>

            <div id="side-bar" class="side-bar" hidden>
              <button id="row-up" class="side-btn" type="button" aria-label="위 줄 보기">▲</button>
              <button id="row-down" class="side-btn" type="button" aria-label="아래 줄 보기">▼</button>
            </div>
          </div>

          <footer class="tray">
            <!-- 정령의 몸이 곧 남은 행동 수다. 몸의 크기와 투명도, 채운 물방울 개수가 남은 물을 따라간다. -->
            <div id="spirit-meter" class="spirit-meter" role="img" aria-label="정령의 몸에 남은 물">
              <div id="spirit-body" class="spirit-body"></div>
              <div id="drops" class="drops"></div>
            </div>
            <div id="drinks" class="drinks"></div>
            <div id="tools" class="tools">
              <button id="btn-duck" class="tool" type="button" aria-pressed="false" aria-label="물속에 가라앉아 보기">⤓</button>
            </div>
          </footer>

          <div id="finger" class="finger" hidden aria-hidden="true">
            <div class="finger-art"></div>
          </div>

          <div id="overlay-dead" class="overlay evaporated" hidden>
            <div id="dead-art" class="spirit-art" aria-hidden="true"></div>
            <div class="overlay-actions">
              <button id="dead-undo" class="btn" type="button" aria-label="되돌리기">↶</button>
              <button id="dead-restart" class="btn" type="button" aria-label="처음부터">↻</button>
              <button id="dead-skip" class="btn ghost" type="button" aria-label="이 판 건너뛰기" hidden>»</button>
            </div>
          </div>

          <div id="overlay-caught" class="overlay caught" hidden>
            <div id="caught-art" class="caught-art" aria-hidden="true"></div>
            <div class="overlay-actions">
              <button id="caught-undo" class="btn" type="button" aria-label="되돌리기">↶</button>
              <button id="caught-restart" class="btn" type="button" aria-label="처음부터">↻</button>
            </div>
          </div>

          <div id="overlay-won" class="overlay won" hidden>
            <div id="won-art" class="spirit-art" aria-hidden="true"></div>
            <div class="overlay-actions">
              <button id="won-next" class="btn" type="button" aria-label="다음 판">▶</button>
              <button id="won-undo" class="btn ghost" type="button" aria-label="되돌려 보기">↶</button>
            </div>
          </div>

          <div id="prologue" class="prologue" hidden>
            <div id="prologue-stage" class="prologue-stage">
              <div id="prologue-panel" class="prologue-panel">
                <div id="prologue-art" class="prologue-art"></div>
              </div>
            </div>
            <div class="prologue-actions">
              <button id="prologue-skip" class="btn ghost" type="button" aria-label="건너뛰기">»</button>
              <button id="prologue-next" class="btn" type="button" aria-label="다음">▶</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="src/layout.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/levels.js"></script>
  <script src="assets/manifest.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/story.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
