<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카페 시제품</title>
  <style>
    /* 목표 문장(CLAUDE.md "확정한 방향")으로 만든 회색 상자 시제품이다. 그림 없이 규칙이 와닿는지만 본다. */
    :root {
      --bg: #e9e7e3;
      --ink: #2b2b2b;
      --floor: #f6f4f0;
      --wall: #8a8580;
      --mine: #6cc3a0;
      --theirs: #d9534a;
      --bank: #f2e6cf;
      --chair: #b9a27f;
      --gaze: rgba(255, 204, 51, 0.38);
      --cell: 64px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    [hidden] { display: none !important; }

    .wrap {
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 20px;
      padding-right: 20px;
      padding-top: 16px;
      padding-bottom: 40px;
    }

    .bar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 14px;
    }

    .btn {
      min-width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 3px solid var(--ink);
      background: #fff;
      font-size: 20px;
      font-weight: 800;
    }

    .btn:disabled { opacity: 0.35; cursor: default; }

    .board-wrap {
      display: flex;
      justify-content: center;
    }

    .board {
      position: relative;
      overflow: hidden;
      background: var(--floor);
      border-radius: 10px;
    }

    .tile,
    .gaze,
    .thing {
      position: absolute;
      width: var(--cell);
      height: var(--cell);
    }

    .tile.wall { background: var(--wall); }

    /* 상대가 지금 보고 있는 칸. 들켰을 때는 잠깐 붉게 바뀐다. */
    .gaze {
      background: var(--gaze);
      transition: background 0.15s ease;
    }

    .board.seen .gaze { background: rgba(217, 83, 74, 0.45); }

    .thing {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 90ms linear;
    }

    .thing::after {
      content: "";
      border: 4px solid var(--ink);
    }

    .thing.player::after {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: var(--mine);
    }

    /* 옆자리 사람. 위쪽 두꺼운 테두리는 헤드폰이다. */
    .thing.neighbor::after {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: var(--theirs);
      border-top-width: 9px;
      border-top-color: #fff;
    }

    .board.seen .thing.neighbor::after {
      box-shadow: 0 0 0 6px rgba(217, 83, 74, 0.5);
    }

    /* 보조배터리: 위에 작은 단자가 달린 세로 상자 */
    .thing.bank::after {
      width: 36%;
      height: 58%;
      border-radius: 6px;
      background: var(--bank);
    }

    .thing.bank::before {
      content: "";
      position: absolute;
      top: 16%;
      width: 14%;
      height: 6%;
      background: var(--ink);
      border-radius: 2px;
    }

    .thing.chair::after {
      width: 60%;
      height: 60%;
      border-radius: 10px;
      background: var(--chair);
    }

    /* 상대 옆 벽의 콘센트와 거기 꽂힌 플러그. 판을 깨면 상대 플러그가 빠지고 내 플러그가 꽂힌다. */
    .thing.outlet::after {
      width: 46%;
      height: 46%;
      border-radius: 50%;
      background: #fffaf0;
    }

    .thing.plug {
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .thing.plug::after {
      width: 24%;
      height: 24%;
      border-radius: 4px;
      background: var(--theirs);
    }

    .thing.plug.mine::after { background: var(--mine); }
    .thing.plug.pulled { opacity: 0; }

    .board.bump { animation: bump 0.12s ease; }

    @keyframes bump {
      50% { transform: translateX(2px); }
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 6px;
      justify-content: center;
      margin-top: 16px;
    }

    .pad .btn {
      width: 56px;
      height: 56px;
    }

    .pad [data-dir="up"] { grid-column: 2; grid-row: 1; }
    .pad [data-dir="wait"] { grid-column: 3; grid-row: 1; }
    .pad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .pad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .pad [data-dir="right"] { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="bar">
      <button id="undo" class="btn" type="button" aria-label="되돌리기">↶</button>
      <button id="restart" class="btn" type="button" aria-label="처음부터">↻</button>
    </div>
    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>
    <div id="pad" class="pad">
      <button class="btn" type="button" data-dir="up" aria-label="위">▲</button>
      <button class="btn" type="button" data-dir="wait" aria-label="제자리에서 기다리기">○</button>
      <button class="btn" type="button" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="btn" type="button" data-dir="down" aria-label="아래">▼</button>
      <button class="btn" type="button" data-dir="right" aria-label="오른쪽">▶</button>
    </div>
  </main>

  <script src="engine.js"></script>
  <script src="levels.js"></script>
  <script>
    (function () {
      'use strict';

      const Engine = window.CafeEngine;
      const levels = window.CAFE_LEVELS.map(Engine.parseLevel);
      const board = document.getElementById('board');
      const ui = {
        undo: document.getElementById('undo'),
        restart: document.getElementById('restart'),
      };
      const game = { level: null, state: null, history: [], busy: false, won: false, things: {} };

      // 칸 크기는 화면 폭에 맞춘다. 좌우 여백 20px씩을 빼고, 큰 화면에서는 64px을 넘지 않는다.
      // innerWidth는 휴대폰에서 내용이 넘치면 함께 커지므로 clientWidth를 쓴다.
      function fitCell() {
        const available = Math.min(document.documentElement.clientWidth, 760) - 40;
        const cell = Math.max(28, Math.min(64, Math.floor(available / game.level.width)));
        document.documentElement.style.setProperty('--cell', `${cell}px`);
        board.style.width = `${cell * game.level.width}px`;
        board.style.height = `${cell * game.level.height}px`;
      }

      function place(element, x, y) {
        element.style.transform = `translate(calc(var(--cell) * ${x}), calc(var(--cell) * ${y}))`;
      }

      function add(className, position) {
        const element = document.createElement('div');
        element.className = className;
        place(element, position.x, position.y);
        board.appendChild(element);
        return element;
      }

      // 상대 옆에서 벽에 붙은 칸을 콘센트 자리로 쓴다. 시선 방향의 반대쪽 벽을 먼저 찾는다.
      function outletCell(level) {
        const n = level.neighbor;
        const back = Engine.DIRECTIONS[level.gaze[0]];
        const candidates = [{ x: n.x - back.dx, y: n.y - back.dy }, { x: n.x, y: n.y - 1 }, { x: n.x, y: n.y + 1 }];
        return candidates.find((cell) => level.walls.has(`${cell.x},${cell.y}`)) || candidates[0];
      }

      function startLevel(index) {
        game.level = levels[index];
        game.state = game.level.start;
        game.history = [];
        game.busy = false;
        game.won = false;
        draw();
      }

      function draw() {
        const { level, state } = game;
        fitCell();
        board.innerHTML = '';
        board.classList.remove('seen');
        for (let y = 0; y < level.height; y++) {
          for (let x = 0; x < level.width; x++) {
            if (level.walls.has(`${x},${y}`)) add('tile wall', { x, y });
          }
        }
        game.gazeLayer = document.createElement('div');
        board.appendChild(game.gazeLayer);
        const outlet = outletCell(level);
        add('thing outlet', outlet);
        game.things.plug = add('thing plug', outlet);
        game.things.neighbor = add('thing neighbor', level.neighbor);
        game.things.chairs = state.chairs.map((chair) => add('thing chair', chair));
        game.things.bank = add('thing bank', state.bank);
        game.things.player = add('thing player', state.player);
        drawGaze();
        ui.undo.disabled = game.history.length === 0;
      }

      function drawGaze() {
        game.gazeLayer.innerHTML = '';
        if (game.won) return;
        for (const cell of Engine.gazeAt(game.level, game.state).cells) {
          const element = document.createElement('div');
          element.className = 'gaze';
          place(element, cell.x, cell.y);
          game.gazeLayer.appendChild(element);
        }
      }

      function placeAll(state) {
        place(game.things.player, state.player.x, state.player.y);
        place(game.things.bank, state.bank.x, state.bank.y);
        state.chairs.forEach((chair, index) => place(game.things.chairs[index], chair.x, chair.y));
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function act(action) {
        if (game.busy || game.won) return;
        const result = Engine.step(game.level, game.state, action);
        if (result.seen) {
          // 들키면 한 걸음 내디딘 모습을 잠깐 보여 주고, 상대가 이쪽을 보는 순간 제자리로 돌아온다. 기록은 남기지 않는다.
          game.busy = true;
          const before = game.state;
          placeAll(result.attempted);
          game.state = result.attempted;
          drawGaze();
          board.classList.add('seen');
          await wait(380);
          board.classList.remove('seen');
          game.state = before;
          placeAll(game.state);
          drawGaze();
          game.busy = false;
          return;
        }
        if (!result.moved) {
          board.classList.remove('bump');
          void board.offsetWidth;
          board.classList.add('bump');
          return;
        }
        game.history.push(game.state);
        game.state = result.state;
        placeAll(game.state);
        drawGaze();
        ui.undo.disabled = false;
        if (result.won) await win();
      }

      // 상대가 보조배터리를 집어 휴대폰을 옮겨 꽂고, 콘센트에서 자기 플러그를 뽑는다. 그 자리에 내 플러그가 꽂힌다.
      async function win() {
        game.won = true;
        game.busy = true;
        drawGaze();
        await wait(250);
        place(game.things.bank, game.level.neighbor.x, game.level.neighbor.y);
        await wait(400);
        game.things.plug.classList.add('pulled');
        await wait(450);
        game.things.plug.classList.remove('pulled');
        game.things.plug.classList.add('mine');
        game.busy = false;
      }

      function undo() {
        if (game.busy || game.history.length === 0) return;
        game.state = game.history.pop();
        game.won = false;
        draw();
      }

      const KEY_ACTIONS = {
        arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', ' ': 'wait', '.': 'wait',
      };

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (KEY_ACTIONS[key]) {
          event.preventDefault();
          act(KEY_ACTIONS[key]);
        } else if (key === 'z' || key === 'backspace') {
          event.preventDefault();
          undo();
        } else if (key === 'r') {
          if (!game.busy) startLevel(0);
        }
      });
      document.querySelectorAll('#pad [data-dir]').forEach((button) => {
        button.addEventListener('click', () => act(button.dataset.dir));
      });
      ui.undo.addEventListener('click', undo);
      ui.restart.addEventListener('click', () => {
        if (!game.busy) startLevel(0);
      });
      window.addEventListener('resize', () => {
        if (!game.busy) draw();
      });

      startLevel(0);
    })();
  </script>
</body>
</html>
