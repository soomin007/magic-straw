<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>운동량 시제품 검증</title>
  <style>
    body { margin: 0; padding: 20px; font: 14px/1.6 ui-monospace, Consolas, monospace; background: #1d1b19; color: #eee; }
    #summary { font-weight: bold; margin-bottom: 12px; }
    .fail { color: #ff8a80; }
  </style>
</head>
<body>
  <!-- 판마다 해법 탐색으로 최소 던지기 수를 찾아, levels.js에 적은 값과 같은지 본다. 던질 물건이 하나 모자라면 못 깨는지도 본다. -->
  <div id="summary">검증 중...</div>
  <pre id="log"></pre>
  <script src="engine.js"></script>
  <script src="levels.js"></script>
  <script>
    const lines = [];
    let failures = 0;
    function expect(condition, message) {
      lines.push(`${condition ? 'PASS' : 'FAIL'}  ${message}`);
      if (!condition) failures += 1;
    }
    for (const definition of window.NEWTON_LEVELS) {
      const level = NewtonEngine.parseLevel(definition);
      const result = NewtonEngine.solve(level);
      expect(result.moves === definition.optimal,
        `${definition.id}: 최소 ${result.moves}번 던짐 (기록된 값 ${definition.optimal}) [${(result.path || []).join(' ')}]`);
      if (definition.throws > definition.optimal) {
        lines.push(`      던질 물건 ${definition.throws}개 중 여유 ${definition.throws - definition.optimal}개`);
      }
      const short = NewtonEngine.solve(NewtonEngine.parseLevel({ ...definition, throws: definition.optimal - 1 }));
      expect(short.moves === null, `${definition.id}: 물건이 하나 모자라면 못 깸`);
    }
    document.getElementById('summary').textContent = failures === 0 ? '모든 검증 통과' : `실패 ${failures}개`;
    document.getElementById('summary').className = failures === 0 ? '' : 'fail';
    document.getElementById('log').textContent = lines.join('\n');
  </script>
</body>
</html>
