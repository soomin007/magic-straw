<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>운동량 시제품</title>
  <style>
    /* 장소와 인물을 정하기 전의 회색 상자 시제품이다. 규칙이 재미있는지만 본다(known-issues 17번). */
    :root {
      --bg: #e9e7e3;
      --ink: #2b2b2b;
      --floor: #f6f4f0;
      --wall: #6d6a66;
      --player: #5aa9d6;
      --block: #c9c6c0;
      --goal: #e0a800;
      --cell: 64px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    [hidden] { display: none !important; }

    .wrap {
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 20px;
      padding-right: 20px;
      padding-top: 16px;
      padding-bottom: 40px;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .dots,
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .dot.current { background: var(--ink); color: #fff; }
    .dot.cleared { background: #9fd3b8; }

    .btn {
      min-width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 3px solid var(--ink);
      background: #fff;
      font-size: 20px;
      font-weight: 800;
    }

    .btn:disabled { opacity: 0.35; cursor: default; }

    .board-wrap {
      display: flex;
      justify-content: center;
    }

    .board {
      position: relative;
      overflow: hidden;
      background: var(--floor);
      border-radius: 10px;
    }

    .tile,
    .body,
    .goal {
      position: absolute;
      width: var(--cell);
      height: var(--cell);
    }

    .tile.wall { background: var(--wall); }

    /* 물건이 멈춰야 할 곳은 점선 네모다. 물건이 올라가면 진하게 바뀐다. */
    .goal {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .goal::after {
      content: "";
      width: 70%;
      height: 70%;
      border-radius: 8px;
      border: 4px dashed var(--goal);
    }

    .goal.filled::after {
      border-style: solid;
      background: rgba(224, 168, 0, 0.25);
    }

    .body {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 70ms linear;
    }

    .body::after {
      content: "";
      border: 4px solid var(--ink);
    }

    .body.player::after {
      width: 72%;
      height: 72%;
      border-radius: 50%;
      background: var(--player);
    }

    .body.block::after {
      width: 64%;
      height: 64%;
      border-radius: 8px;
      background: var(--block);
    }

    .board.won .body.player::after {
      background: #9fd3b8;
    }

    .board.bump {
      animation: bump 0.12s ease;
    }

    @keyframes bump {
      50% { transform: translateX(2px); }
    }

    .result {
      display: flex;
      justify-content: center;
      margin-top: 16px;
      min-height: 42px;
    }

    /* 휴대폰처럼 방향키가 없는 화면을 위한 방향 버튼 */
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 6px;
      justify-content: center;
      margin-top: 16px;
    }

    .pad .btn {
      width: 56px;
      height: 56px;
    }

    .pad [data-dir="up"] { grid-column: 2; grid-row: 1; }
    .pad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .pad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .pad [data-dir="right"] { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="bar">
      <nav id="dots" class="dots" aria-label="판 고르기"></nav>
      <div class="controls">
        <button id="undo" class="btn" type="button" aria-label="되돌리기">↶</button>
        <button id="restart" class="btn" type="button" aria-label="처음부터">↻</button>
      </div>
    </div>
    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>
    <div class="result">
      <button id="next" class="btn" type="button" aria-label="다음 판" hidden>▶</button>
    </div>
    <div id="pad" class="pad">
      <button class="btn" type="button" data-dir="up" aria-label="위">▲</button>
      <button class="btn" type="button" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="btn" type="button" data-dir="down" aria-label="아래">▼</button>
      <button class="btn" type="button" data-dir="right" aria-label="오른쪽">▶</button>
    </div>
  </main>

  <script src="engine.js"></script>
  <script src="levels.js"></script>
  <script>
    (function () {
      'use strict';

      const Engine = window.NewtonEngine;
      const levels = window.NEWTON_LEVELS.map(Engine.parseLevel);
      const TICK_MS = 70;
      const board = document.getElementById('board');
      const ui = {
        dots: document.getElementById('dots'),
        undo: document.getElementById('undo'),
        restart: document.getElementById('restart'),
        next: document.getElementById('next'),
      };
      const game = { index: 0, level: null, state: null, history: [], busy: false, cleared: new Set(), player: null, blocks: [] };

      // 칸 크기는 화면 폭에 맞춘다. 좌우 여백 20px씩을 빼고, 큰 화면에서는 64px을 넘지 않는다.
      // innerWidth는 휴대폰에서 내용이 넘치면 함께 커져서 판이 계속 커지므로, 넘침과 상관없는 clientWidth를 쓴다.
      function fitCell() {
        const available = Math.min(document.documentElement.clientWidth, 760) - 40;
        const cell = Math.max(28, Math.min(64, Math.floor(available / game.level.width)));
        document.documentElement.style.setProperty('--cell', `${cell}px`);
        board.style.width = `${cell * game.level.width}px`;
        board.style.height = `${cell * game.level.height}px`;
      }

      function place(element, x, y) {
        element.style.transform = `translate(calc(var(--cell) * ${x}), calc(var(--cell) * ${y}))`;
      }

      function startLevel(index) {
        game.index = index;
        game.level = levels[index];
        game.state = game.level.start;
        game.history = [];
        game.busy = false;
        draw();
      }

      function draw() {
        const { level, state } = game;
        fitCell();
        board.innerHTML = '';
        for (let y = 0; y < level.height; y++) {
          for (let x = 0; x < level.width; x++) {
            if (!level.walls.has(`${x},${y}`)) continue;
            const tile = document.createElement('div');
            tile.className = 'tile wall';
            place(tile, x, y);
            board.appendChild(tile);
          }
        }
        for (const goal of level.goals) {
          const element = document.createElement('div');
          element.className = 'goal';
          element.dataset.key = `${goal.x},${goal.y}`;
          place(element, goal.x, goal.y);
          board.appendChild(element);
        }
        game.player = addBody('player', state.player);
        game.blocks = state.blocks.map((block) => addBody('block', block));
        refresh();
      }

      function addBody(kind, position) {
        const element = document.createElement('div');
        element.className = `body ${kind}`;
        place(element, position.x, position.y);
        board.appendChild(element);
        return element;
      }

      function refresh() {
        const won = Engine.won(game.level, game.state);
        board.classList.toggle('won', won);
        board.querySelectorAll('.goal').forEach((goal) => {
          goal.classList.toggle('filled', game.state.blocks.some((block) => `${block.x},${block.y}` === goal.dataset.key));
        });
        ui.dots.innerHTML = '';
        levels.forEach((level, index) => {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'dot';
          dot.textContent = String(index + 1);
          dot.classList.toggle('current', index === game.index);
          dot.classList.toggle('cleared', game.cleared.has(level.id));
          dot.addEventListener('click', () => {
            if (!game.busy) startLevel(index);
          });
          ui.dots.appendChild(dot);
        });
        ui.undo.disabled = game.history.length === 0;
        ui.next.hidden = !won;
        if (won) game.cleared.add(game.level.id);
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      // 한 걸음. 벽이면 판이 살짝 흔들리기만 하고, 되돌리기 기록도 남기지 않는다.
      async function move(direction) {
        if (game.busy || Engine.won(game.level, game.state)) return;
        const result = Engine.step(game.level, game.state, direction);
        if (!result.moved) {
          board.classList.remove('bump');
          void board.offsetWidth;
          board.classList.add('bump');
          return;
        }
        game.history.push(game.state);
        game.state = result.state;
        place(game.player, result.state.player.x, result.state.player.y);
        if (result.kicked) {
          game.busy = true;
          for (const frame of result.frames) {
            frame.forEach((position, index) => place(game.blocks[index], position.x, position.y));
            await wait(TICK_MS);
          }
          game.busy = false;
        }
        refresh();
      }

      function undo() {
        if (game.busy || game.history.length === 0) return;
        game.state = game.history.pop();
        draw();
      }

      const KEY_DIRECTIONS = {
        arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right',
      };

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (KEY_DIRECTIONS[key]) {
          event.preventDefault();
          move(KEY_DIRECTIONS[key]);
        } else if (key === 'z' || key === 'backspace') {
          event.preventDefault();
          undo();
        } else if (key === 'r') {
          if (!game.busy) startLevel(game.index);
        } else if ((key === 'enter' || key === ' ') && !ui.next.hidden) {
          event.preventDefault();
          ui.next.click();
        }
      });
      document.querySelectorAll('#pad [data-dir]').forEach((button) => {
        button.addEventListener('click', () => move(button.dataset.dir));
      });
      ui.undo.addEventListener('click', undo);
      ui.restart.addEventListener('click', () => {
        if (!game.busy) startLevel(game.index);
      });
      ui.next.addEventListener('click', () => startLevel((game.index + 1) % levels.length));
      window.addEventListener('resize', () => {
        if (!game.busy) draw();
      });

      startLevel(0);
    })();
  </script>
</body>
</html>
